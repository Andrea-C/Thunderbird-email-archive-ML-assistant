<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Email Archive Assistant - Training</title>
    <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 20px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
    }
    
    .sidebar {
      border-right: 1px solid #ddd;
      padding-right: 20px;
    }
    
    .main-content {
      padding-left: 20px;
    }
    
    select, button {
      margin: 8px 0;
      padding: 8px;
      width: 100%;
    }
    
    .folder-tree {
      margin: 20px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      max-height: 400px;
      overflow-y: auto;
    }
    
    .folder-item {
      display: flex;
      align-items: center;
      padding: 4px 0;
      transition: background-color 0.2s;
    }
    
    .folder-item:hover {
      background-color: #f5f5f5;
    }
    
    .folder-item input[type="checkbox"] {
      margin-right: 8px;
    }
    
    .folder-item label {
      cursor: pointer;
      user-select: none;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .folder-item.default {
      font-weight: bold;
    }
    
    .progress-box {
      margin: 10px 0;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }
    
    .models-list {
      margin: 20px 0;
      border: 1px solid #ddd;
      padding: 10px;
    }
    
    .model-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px;
      border-bottom: 1px solid #eee;
    }
    
    .model-item button {
      width: auto;
      min-width: 80px;
      margin-left: 20px;
      padding: 4px 12px;
    }
    
    .model-item span {
      flex: 1;
      margin-right: 20px;
    }
    
    #status {
      margin-top: 16px;
      padding: 8px;
      border-radius: 4px;
    }
    
    .success { background: #e6ffe6; }
    .error { background: #ffe6e6; }
    .warning { background: #fff3e6; }
    
    .sync-status {
      font-style: italic;
      color: #666;
    }
    
    .algorithm-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
      background: #f9f9f9;
    }
    
    .algorithm-section h4 {
      margin: 0 0 12px 0;
      font-size: 0.95em;
      color: #333;
    }
    
    .algorithm-option {
      display: flex;
      align-items: flex-start;
      margin: 10px 0;
      padding: 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    .algorithm-option:hover {
      background-color: #e8f4fc;
    }
    
    .algorithm-option input[type="radio"] {
      margin-right: 10px;
      margin-top: 3px;
    }
    
    .algorithm-option label {
      cursor: pointer;
      flex: 1;
    }
    
    .algorithm-name {
      font-weight: 600;
      color: #333;
      display: block;
    }
    
    .algorithm-desc {
      font-size: 0.85em;
      color: #666;
      margin-top: 2px;
      display: block;
    }
    
    .algorithm-badge {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 3px;
      font-size: 0.75em;
      font-weight: 600;
      margin-left: 8px;
      vertical-align: middle;
    }
    
    .badge-best {
      background: #cce5ff;
      color: #004085;
    }
    
    .badge-recommended {
      background: #d4edda;
      color: #155724;
    }
    
    .badge-basic {
      background: #e2e3e5;
      color: #383d41;
    }
    
    .evaluation-panel {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 4px;
    }

    .evaluation-panel summary {
      cursor: pointer;
      font-weight: bold;
    }

    .evaluation-panel h4 {
      margin: 14px 0 6px 0;
    }

    .evaluation-summary {
      margin: 10px 0;
      font-size: 1.05em;
    }

    .evaluation-table {
      border-collapse: collapse;
      font-size: 0.9em;
    }

    .evaluation-table th,
    .evaluation-table td {
      border: 1px solid #ddd;
      padding: 3px 8px;
      text-align: left;
    }

    .evaluation-table td.num {
      text-align: right;
    }

    .evaluation-table tr.highlight {
      background: #fff3cd;
      font-weight: bold;
    }

    .evaluation-table tr.insufficient {
      color: #999;
    }

    #copyReportButton {
      width: auto;
      margin-top: 10px;
    }

    #reportFallback {
      width: 100%;
      height: 200px;
      margin-top: 8px;
      font-family: monospace;
    }

    .model-algorithm {
      font-size: 0.8em;
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="sidebar">
    <h3>Account Selection</h3>
    <select id="accountSelect">
      <option value="">Select an account...</option>
    </select>
    
    <div id="folderTree" class="folder-tree">
      <!-- Folders will be populated here -->
    </div>
    
    <button id="selectAllFolders">Select All</button>
    <button id="deselectAllFolders">Deselect All</button>
    
    <div class="algorithm-section">
      <h4>Classification Algorithm</h4>
      
      <div class="algorithm-option">
        <input type="radio" name="algorithm" id="algo-svm" value="svm">
        <label for="algo-svm">
          <span class="algorithm-name">
            SVM
            <span class="algorithm-badge badge-best">Best Accuracy</span>
          </span>
          <span class="algorithm-desc">Support Vector Machine - highest accuracy, slower training</span>
        </label>
      </div>
      
      <div class="algorithm-option">
        <input type="radio" name="algorithm" id="algo-tfidf" value="tfidf_naive_bayes" checked>
        <label for="algo-tfidf">
          <span class="algorithm-name">
            TF-IDF Naive Bayes
            <span class="algorithm-badge badge-recommended">Recommended</span>
          </span>
          <span class="algorithm-desc">Good accuracy with word importance weighting</span>
        </label>
      </div>
      
      <div class="algorithm-option">
        <input type="radio" name="algorithm" id="algo-naive" value="naive_bayes">
        <label for="algo-naive">
          <span class="algorithm-name">
            Naive Bayes
            <span class="algorithm-badge badge-basic">Basic</span>
          </span>
          <span class="algorithm-desc">Fast and simple, original algorithm</span>
        </label>
      </div>
    </div>
    
    <div class="algorithm-section">
      <h4>Training Options</h4>
      <div class="algorithm-option">
        <input type="checkbox" id="includeBody" checked>
        <label for="includeBody">
          <span class="algorithm-name">Include message body</span>
          <span class="algorithm-desc">Reads every message (slower). Uncheck to train on sender + subject only.</span>
        </label>
      </div>
    </div>
    
    <button id="trainButton">Start Training</button>
  </div>
  
  <div class="main-content">
    <h2>Email Archive Assistant - Training</h2>
    
    <div class="models-list">
      <h3>Trained Models</h3>
      <div id="modelsList">
        <!-- Models will be listed here -->
      </div>
    </div>
    
    <div class="progress-box">
      <h3>Training Progress</h3>
      <div id="folderProgress">
        Folders: <span id="folderCount">-</span>
      </div>
      <div id="messageProgress">
        Messages: <span id="messageCount">-</span>
      </div>
      <div id="currentFolder" class="sync-status"></div>
    </div>
    
    <div id="status"></div>

    <details id="evaluationPanel" class="evaluation-panel" open hidden>
      <summary id="evaluationTitle">Evaluation report</summary>
      <div id="evaluationContent"></div>
      <button id="copyReportButton">Copy report as Markdown</button>
      <textarea id="reportFallback" readonly hidden></textarea>
    </details>
  </div>

  <script src="train.js"></script>
</body>
</html>
